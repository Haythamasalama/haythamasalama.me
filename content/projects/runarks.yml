title: 'Runarks · Governed access to production databases'
year: 2026
context: Founder · Aug 2026 – now
description: 'A SaaS that puts every query against a production database through review. Each statement is read for what it does before anyone approves it; reads need one approval and writes two by default, adjustable per project, and nobody approves their own request. The person who asked runs it once, sensitive fields are masked before results leave, DROP and TRUNCATE never run, and every step lands in an append-only log. Nobody is shown a database password.'
