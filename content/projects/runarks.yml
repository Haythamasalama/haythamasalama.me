title: Runarks · governed database access
year: 2026
context: Founder · Aug 2026 – now
description: 'A SaaS for governed access to production databases. Developers run queries through a mandatory approval cycle: reads take one approval and writes take two, and nobody approves their own request. Every statement is read for what it does before it runs, sensitive fields are masked on the way out, and everything lands in an append-only log. Nobody holds a production password.'
