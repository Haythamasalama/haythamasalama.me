description: 'A step-by-step path to learning Vue.js: what to know first, 14 stages from your first component to Vue Router and Pinia, the official docs and videos for each, and projects to build.'
intro: 'Learn Vue one stage at a time, with two projects on the way. Most stages link to the part of the official docs that teaches them. Tick topics as you go: your progress stays in this browser.'
source: https://github.com/Haythamasalama/vue-path
before:
- title: HTML
  icon: simple-icons:html5
- title: CSS
  icon: simple-icons:css
  topics:
  - Flexbox
  - Grid
  - Positioning
- title: JavaScript
  icon: simple-icons:javascript
  topics:
  - Higher-order functions
  - Arrow functions
  - Destructuring
  - The DOM
  links:
  - label: Learn JavaScript in Arabic, Elzero Web School (lessons 71 to 78 and 86 to 101)
    to: https://www.youtube.com/playlist?list=PLDoPjvoNmBAx3kiplQR_oeDqLDBUDYwVv
steps:
