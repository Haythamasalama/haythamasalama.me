vision:
  line: Software that people — and agents — can trust.
  text: Software is moving from screens people click to agents that act on their behalf. I want the platforms I build, the ones that move money and deliveries, to be ready for that — clear domains, strict rules and safe interfaces an AI can use without breaking anyone's trust.
