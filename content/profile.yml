# The About page: headline, story, organizations, awards and vision.
# Experience, education and skills come from their own collections.
headline: Senior Software Engineer at WINCH
focus: SaaS · AI · FinTech · Logistics
location: Cairo, Egypt
careerStart: 2016-04
about:
  - "I'm a senior software engineer at WINCH, a logistics platform in Saudi Arabia, working remotely from Cairo. I set up its business and carrier platforms and build the APIs behind their apps and dashboards, along with the core components every product relies on: security, notifications, exports, and the integration engine that connects WINCH to government services, payment gateways and AI models. I evolved the Domain-Driven Design structure the back end follows, and led the move of the old code onto it with the team."
  - "Before WINCH, I built fintech and operations software. At Sanad I built the API and admin dashboard of a real-estate investment platform, from verified investors and a wallet ledger to returns paid on a schedule. At Faris Petrol I built the systems its teams ran on: a vehicle inspection and maintenance system behind thousands of checks a month, CRM and HR systems, bulk card charging for the Clever loyalty app, and IoT control for its car-wash stations. It all started in 2016, building websites for clients as a freelancer."
  - "Today AI is part of how I build: I plan, write and review code with coding agents like Claude Code and Cursor, and at WINCH I write the agents and skills our engineers code with. Outside work, I'm building Runarks, my own product for governed access to production databases, and I'm part of the Nuxt UI team."
